<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Tesla login</title><style>:root{color-scheme:light dark}body{font:16px/1.5 -apple-system,system-ui,sans-serif;max-width:560px;margin:48px auto;padding:0 16px}textarea{width:100%;height:7em;font:13px ui-monospace,Menlo,monospace}button{font:inherit;padding:8px 18px;margin-top:8px}</style></head><body><h1>Tesla login</h1><p id="msg">This page receives the Tesla login redirect.</p><textarea id="out" readonly hidden></textarea><button id="copy" hidden>Copy</button><script>var p=new URLSearchParams(location.search),m=document.getElementById("msg"),o=document.getElementById("out"),b=document.getElementById("copy");if(p.get("code")){m.textContent="Login worked. Copy this and paste it into Terminal. It expires in a few minutes.";o.value=location.href;o.hidden=false;b.hidden=false;b.onclick=function(){o.select();navigator.clipboard.writeText(o.value).catch(function(){document.execCommand("copy")});b.textContent="Copied"};history.replaceState(null,"",location.pathname)}else if(p.get("error")){m.textContent="Tesla returned an error: "+p.get("error")+" "+(p.get("error_description")||"")}</script></body></html>
